<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Background gradient matching site dark navy -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1525"/>
      <stop offset="100%" stop-color="#091220"/>
    </linearGradient>
    <!-- Teal glow gradient for shield fill -->
    <linearGradient id="shieldFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0ECEC0" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0ECEC0" stop-opacity="0.04"/>
    </linearGradient>
    <!-- Teal stroke gradient -->
    <linearGradient id="shieldStroke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0ECEC0"/>
      <stop offset="100%" stop-color="#09A99D"/>
    </linearGradient>
    <!-- Inner glow for center node -->
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0ECEC0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0ECEC0" stop-opacity="0"/>
    </radialGradient>
    <!-- Subtle outer ring glow -->
    <radialGradient id="outerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#0ECEC0" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0ECEC0" stop-opacity="0.06"/>
    </radialGradient>
    <clipPath id="shieldClip">
      <!-- Shield path for clipping inner elements -->
      <path d="M250 110 L370 155 L370 268 Q370 342 250 395 Q130 342 130 268 L130 155 Z"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" rx="108" fill="url(#bg)"/>

  <!-- Subtle outer ring glow -->
  <rect width="500" height="500" rx="108" fill="url(#outerGlow)"/>

  <!-- Very subtle grid texture -->
  <g opacity="0.03" stroke="#0ECEC0" stroke-width="1">
    <line x1="0" y1="100" x2="500" y2="100"/>
    <line x1="0" y1="200" x2="500" y2="200"/>
    <line x1="0" y1="300" x2="500" y2="300"/>
    <line x1="0" y1="400" x2="500" y2="400"/>
    <line x1="100" y1="0" x2="100" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
  </g>

  <!-- Shield shape — filled -->
  <path d="M250 108 L372 155 L372 270 Q372 346 250 400 Q128 346 128 270 L128 155 Z"
    fill="url(#shieldFill)"/>

  <!-- Shield outer border -->
  <path d="M250 108 L372 155 L372 270 Q372 346 250 400 Q128 346 128 270 L128 155 Z"
    fill="none"
    stroke="url(#shieldStroke)"
    stroke-width="2.5"
    stroke-linejoin="round"/>

  <!-- Shield inner border (thinner, offset inward) -->
  <path d="M250 123 L358 165 L358 268 Q358 334 250 383 Q142 334 142 268 L142 165 Z"
    fill="none"
    stroke="#0ECEC0"
    stroke-width="1"
    stroke-opacity="0.2"
    stroke-linejoin="round"/>

  <!-- Neural network nodes — clipped to shield -->
  <g clip-path="url(#shieldClip)">
    <!-- Connection lines between nodes (drawn first, under nodes) -->
    <g stroke="#0ECEC0" stroke-width="1.2" stroke-linecap="round" opacity="0.28">
      <!-- Top node → left node -->
      <line x1="250" y1="187" x2="193" y2="272"/>
      <!-- Top node → right node -->
      <line x1="250" y1="187" x2="307" y2="272"/>
      <!-- Left node → right node -->
      <line x1="193" y1="272" x2="307" y2="272"/>
      <!-- Top → center -->
      <line x1="250" y1="187" x2="250" y2="253"/>
      <!-- Left → center -->
      <line x1="193" y1="272" x2="250" y2="253"/>
      <!-- Right → center -->
      <line x1="307" y1="272" x2="250" y2="253"/>
      <!-- Bottom node connections -->
      <line x1="250" y1="253" x2="250" y2="335"/>
      <line x1="193" y1="272" x2="250" y2="335"/>
      <line x1="307" y1="272" x2="250" y2="335"/>
    </g>

    <!-- ECG/pulse line cutting horizontally across center -->
    <path d="M155 253 L205 253 L215 228 L228 278 L240 253 L260 253 L272 228 L285 278 L295 253 L345 253"
      fill="none"
      stroke="#0ECEC0"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      opacity="0.55"/>
  </g>

  <!-- Outer node glow halos -->
  <circle cx="250" cy="187" r="18" fill="url(#nodeGlow)"/>
  <circle cx="193" cy="272" r="18" fill="url(#nodeGlow)"/>
  <circle cx="307" cy="272" r="18" fill="url(#nodeGlow)"/>
  <circle cx="250" cy="335" r="18" fill="url(#nodeGlow)"/>

  <!-- Center node glow -->
  <circle cx="250" cy="253" r="28" fill="url(#nodeGlow)"/>

  <!-- Network nodes — outer ring -->
  <!-- Top -->
  <circle cx="250" cy="187" r="6" fill="#0ECEC0" opacity="0.9"/>
  <circle cx="250" cy="187" r="3.5" fill="#0ECEC0"/>
  <!-- Left -->
  <circle cx="193" cy="272" r="6" fill="#0ECEC0" opacity="0.9"/>
  <circle cx="193" cy="272" r="3.5" fill="#0ECEC0"/>
  <!-- Right -->
  <circle cx="307" cy="272" r="6" fill="#0ECEC0" opacity="0.9"/>
  <circle cx="307" cy="272" r="3.5" fill="#0ECEC0"/>
  <!-- Bottom -->
  <circle cx="250" cy="335" r="6" fill="#0ECEC0" opacity="0.9"/>
  <circle cx="250" cy="335" r="3.5" fill="#0ECEC0"/>

  <!-- Center node — larger, brightest -->
  <circle cx="250" cy="253" r="11" fill="#0B1525"/>
  <circle cx="250" cy="253" r="11" fill="none" stroke="#0ECEC0" stroke-width="2" opacity="0.9"/>
  <circle cx="250" cy="253" r="5.5" fill="#0ECEC0"/>

  <!-- Corner accent dots — subtle -->
  <circle cx="156" cy="175" r="1.5" fill="#0ECEC0" opacity="0.3"/>
  <circle cx="344" cy="175" r="1.5" fill="#0ECEC0" opacity="0.3"/>
  <circle cx="140" cy="220" r="1.5" fill="#0ECEC0" opacity="0.2"/>
  <circle cx="360" cy="220" r="1.5" fill="#0ECEC0" opacity="0.2"/>
</svg>
