<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="logo-brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="26" fill="#0f172a" />
  
  <!-- Orbital Rings -->
  <circle cx="50" cy="50" r="40" stroke="url(#logo-brand)" stroke-width="3" stroke-dasharray="8 12" stroke-linecap="round" opacity="0.6"/>
  <circle cx="50" cy="50" r="30" stroke="url(#logo-brand)" stroke-width="3" stroke-dasharray="30 10" stroke-linecap="round" opacity="0.8"/>
  
  <!-- Tech Nodes -->
  <circle cx="90" cy="50" r="4" fill="#2dd4bf" filter="url(#glow)"/>
  <circle cx="50" cy="10" r="4" fill="#06b6d4" filter="url(#glow)"/>
  <circle cx="28" cy="71" r="5" fill="#2dd4bf" filter="url(#glow)"/>
  
  <!-- Central Tech Medical Cross -->
  <path d="M43 32 a 4 4 0 0 1 14 0 v 11 h 11 a 4 4 0 0 1 0 14 h -11 v 11 a 4 4 0 0 1 -14 0 v -11 h -11 a 4 4 0 0 1 0 -14 h 11 v -11 z" fill="url(#logo-brand)" />
</svg>
