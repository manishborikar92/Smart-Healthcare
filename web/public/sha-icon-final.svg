<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <!-- Background -->
  <rect width="500" height="500" rx="110" fill="#0B1120"/>

  <!-- Shield — solid white fill -->
  <path d="M250 108
    L375 158
    L375 272
    Q375 355 250 400
    Q125 355 125 272
    L125 158
    Z"
    fill="white"/>

  <!-- Three node cutouts — negative space, triangular arrangement -->
  <!-- Top center -->
  <circle cx="250" cy="210" r="22" fill="#0B1120"/>
  <!-- Bottom left -->
  <circle cx="196" cy="300" r="22" fill="#0B1120"/>
  <!-- Bottom right -->
  <circle cx="304" cy="300" r="22" fill="#0B1120"/>

  <!-- Connector bars between nodes — negative space -->
  <!-- Top to bottom-left -->
  <line x1="250" y1="210" x2="196" y2="300" stroke="#0B1120" stroke-width="10" stroke-linecap="round"/>
  <!-- Top to bottom-right -->
  <line x1="250" y1="210" x2="304" y2="300" stroke="#0B1120" stroke-width="10" stroke-linecap="round"/>
  <!-- Bottom left to bottom-right -->
  <line x1="196" y1="300" x2="304" y2="300" stroke="#0B1120" stroke-width="10" stroke-linecap="round"/>
</svg>
